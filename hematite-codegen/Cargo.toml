[package]
name = "hematite-codegen"
version.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"
description = "Proc-macro TFLite → typed straight-line Rust compiler (#[model]) with fusion and arena planning; backend-agnostic."

[lib]
proc-macro = true

[dependencies]
hematite-core = { path = "../hematite-core" }
# T4.2b: arena planning delegates to hematite-memory's liveness_plan (T1.3) —
# codegen never re-implements the algorithm. Wired even before `mod arena;`
# lands so the arena module compiles the moment the orchestrator wires it.
hematite-memory = { path = "../hematite-memory" }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# Scratch parity tests (T3.5 / T1.4): the macro-time mirror formulas must equal
# the runtime `S3Backend::*_scratch_size` computations. The dev-dep keeps the
# proc-macro lib itself free of any runtime backend dependency.
hematite-s3 = { path = "../hematite-s3" }
# T1.4: the parity sweep consumes the machine-readable per-kernel corpus
# (`spec::kernel_specs()`) directly — the test never hand-copies spec shapes.
# hematite-benchmarks' own dependency on hematite-codegen is optional
# (model-validation feature, off here), so this dev-dep edge does not cycle.
hematite-benchmarks = { path = "../hematite-benchmarks" }
# T1.2 fused-vs-unfused equivalence gate: runs every zoo model twice
# (`#[model]` fused vs `#[model_unfused]` per-op) through `RefBackend` and
# asserts element-equal outputs + identical FNV-1a.
hematite-ref = { path = "../hematite-ref" }
