[package]
name = "hematite-int8"
version.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"
description = "TFLite-Micro-exact int8 quantization math (32-bit requantize, saturating cast) shared by all Hematite backends."

[dependencies]
hematite-core = { path = "../hematite-core" }

[features]
# Enables host-side helpers that use f64 (quantize_multiplier).
# OFF by default — device builds contain zero floating-point code paths.
host = []
