[package]
name = "hematite-benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ESP32-S3 hardware benchmark suite: per-kernel + model-level CCOUNT benchmarks"

[[bin]]
name = "hematite-benchmarks"
path = "src/main.rs"

[dependencies]
hematite-core = { path = "../hematite-core" }
hematite-int8 = { path = "../hematite-int8" }
hematite-ref = { path = "../hematite-ref" }
hematite-s3 = { path = "../hematite-s3" }
# `#[model]` proc-macro — compiles a real .tflite into a no_std, no-alloc
# `Model<B>` inference bridge at build time. Enabled by the
# `model-validation` feature (device/QEMU model-validation section).
hematite-codegen = { path = "../hematite-codegen", optional = true }

# Device-only dependencies (T5.3 / T5.3a — benchmark firmware on ESP32-S3).
#
# These are gated to the xtensa target so a host `cargo check --workspace`
# / `cargo test --workspace` never compiles them (Phase 3 convention: device
# code is cfg-gated and only structurally reviewed on host).
#
# The hematite-codegen dependency (the `#[model]` proc-macro) is deliberately
# NOT yet linked: the zoo .tflite files arrive with T5.2, and the model-level
# bench currently consumes the generated `Model<B>` API shape through the
# `GeneratedModel` trait in `src/model_bench.rs`. T5.2 adds the macro wiring
# (one `#[model("models/x.tflite")]` annotation per zoo model).
[target.'cfg(target_arch = "xtensa")'.dependencies]
# `unstable` is required for `esp_hal::psram` (the module and the
# `Peripherals::PSRAM` field are `unstable_module!`/`create_peripheral!`-gated
# in esp-hal 1.1.1). The bench PSRAM arena is backed by the runtime-mapped
# PSRAM region via `Psram::new` + `raw_parts` — esp-hal 1.1.1 has NO static
# `.dram1.psram` linker section (that's an esp-idf concept), so a static arena
# cannot be linked.
# `default-features = false` + explicit re-enable of `rt`/`exception-handler`
# drops the `float-save-restore` default feature. The ESP32-S3 has NO FPU, so
# saving/restoring the (non-existent) FPU registers in every exception frame is
# dead code — and it is actively harmful under QEMU: the xtensa-lx-rt esp32s3
# config falsely claims `XCHAL_HAVE_FP=1`, so `save_context` emits `rur.fcr`,
# which QEMU's esp32s3 model does not emulate and hangs on (double-exception
# loop). See benchmarks/QEMU_SIMD_VALIDATION.md.
esp-hal = { workspace = true, default-features = false, features = ["esp32s3", "defmt", "unstable", "rt", "exception-handler"] }
defmt = { workspace = true }
# xtensa-lx-rt: provides `#[entry]` (reset vector) and the runtime startup.
# esp-hal re-exports it under `__macro_implementation`, but the firmware's
# `main` uses the attribute directly so the reset→main chain is rooted even
# in the qemu build (which bypasses `esp_hal::init`).
xtensa-lx-rt = "0.22.0"
# defmt-rtt provides the defmt global logger over RTT. It is linked in BOTH
# builds: the hardware build reads RTT; under QEMU the RTT sink is invisible
# but the crate still supplies the `_defmt_acquire`/`_defmt_write`/
# `_defmt_release` symbols that esp-hal's `defmt` feature requires at link
# time (the firmware's own report output goes to UART0 via `firmware_log!`).
defmt-rtt = "0.4"

[features]
# QEMU smoke-run mode: the firmware writes the report through direct UART0
# register writes (defmt-rtt emits nothing under QEMU — no RTT sink) and
# bypasses the CCOUNT-calibration guardrail (which fails under `-icount`
# timer skew). Every printed number still carries the QEMU-EMULATION label;
# this feature changes ONLY the output transport and guardrail bypass, never
# the benchmark methodology (spec.rs / timing.rs / report.rs are untouched).
qemu = ["hematite-s3/qemu"]
# Model validation: compiles the runnable zoo .tflite models via `#[model]`
# and runs each inference on the device (or QEMU) against the executed-TFLite
# golden, printing PASS/FAIL + FNV-1a per model. Pure validation — does not
# affect kernel benchmarks or report methodology.
model-validation = ["dep:hematite-codegen"]
