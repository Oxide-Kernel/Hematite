<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hematite logo: stylized H + gradient bar (hematite = iron oxide, rust-red) -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b2d26"/>
      <stop offset="100%" stop-color="#b85035"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="18" fill="#161616"/>
  <rect x="22" y="34" width="26" height="60" rx="5" fill="url(#bar)"/>
  <rect x="80" y="34" width="26" height="60" rx="5" fill="url(#bar)"/>
  <rect x="40" y="58" width="48" height="12" rx="5" fill="url(#bar)"/>
  <text x="64" y="116" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a8a8a">HEMATITE</text>
</svg>