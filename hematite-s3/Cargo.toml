[package]
name = "hematite-s3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hematite-core = { path = "../hematite-core" }
hematite-int8 = { path = "../hematite-int8" }
hematite-memory = { path = "../hematite-memory" }

[dev-dependencies]
hematite-tests = { path = "../hematite-tests" }
# The independent scalar oracle for the Wave-2 relu6 vs-ref golden check
# (tests/activations_golden.rs) — never linked into device builds.
hematite-ref = { path = "../hematite-ref" }

[features]
# Propagated from hematite-benchmarks' `qemu` feature. QEMU's xtensa/esp32s3
# TIE728 emulation does not correctly execute `EE.VSMULAS.S8.QACC.LD.INCP`
# (confirmed by direct instruction-level bisection under QEMU — see
# local-notes/notepads/hematite-nn/problems.md), so the conv2d-family SIMD dispatch
# (conv1x1 / conv3x3 / gemm, which all share that entry point) is additionally
# gated off under this feature. Not a code defect — a QEMU emulation gap.
qemu = []
